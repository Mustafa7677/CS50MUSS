name: QazaqCode

on:
  push:
    paths: ["qazaqcode/**", ".github/workflows/qazaqcode.yml"]
  pull_request:
    paths: ["qazaqcode/**", ".github/workflows/qazaqcode.yml"]

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qazaqcode
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qc_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qc_test
      AUTH_DRIVER: local
      AUTH_JWT_SECRET: ci-secret-ci-secret-ci-secret-1234567
      APP_URL: http://127.0.0.1:3100
      ALLOW_LOCAL_AUTH_IN_PRODUCTION: "yes"  # тек CI/E2E: local auth драйвері
      RATE_LIMIT_DISABLED: "yes"             # тек CI/E2E: көп кіру әрекеті
      EMAIL_DRIVER: console                  # e-mail шақыру тесттері (нақты хат жіберілмейді)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: qazaqcode/package-lock.json }
      - run: npm ci
      - name: Лицензиялық шекара (CS50 контенті жоқ)
        run: node scripts/check-licence.mjs
      - name: Дерекқор
        run: |
          psql -h localhost -U postgres -c "create database qc_test"
          bash db/migrate.sh --dev-shim
      - name: Қауіпсіздік тесттері (RLS, оқшаулау, лицензия)
        run: npm run db:test
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Демо дерек және E2E
        run: |
          node scripts/seed-demo.mjs
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Brute force / rate limit тесттері (rate limit ҚОСУЛЫ екінші сервер)
        run: |
          env -u RATE_LIMIT_DISABLED PORT=3216 COOKIE_SECURE=true npx next start -p 3216 > /tmp/rl-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3216/api/health >/dev/null && break; sleep 2; done
          E2E_RL_BASE_URL=http://127.0.0.1:3216 npx playwright test e2e/security.spec.ts
