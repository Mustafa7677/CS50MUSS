# Алаш тұлғаларының портреттерін Wikimedia Commons-тан жүктеп, тармаққа коммит жасайды (қолмен іске қосылады).
name: Портреттерді жүктеу

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow "opencv-python-headless==4.10.0.84" "numpy<2.3"
      - run: python tools/fetch_portraits.py
      - name: Коммит
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/img/alash assets/data/portraits.js
          git diff --cached --quiet && { echo "Өзгеріс жоқ"; exit 0; }
          git commit -m "Portraits of Alash figures from Wikimedia Commons (free licences)"
          git push
