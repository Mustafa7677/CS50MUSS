<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- «Бота» (happy) — CS50 қазақша сайтының түпнұсқа маскоты -->
  <ellipse cx="60" cy="112" rx="34" ry="5" fill="#000" opacity=".12"/>
  <!-- аяқтары -->
  <g fill="#c98a4a">
    <rect x="38" y="84" width="9" height="24" rx="4"/>
    <rect x="73" y="84" width="9" height="24" rx="4"/>
  </g>
  <!-- денесі мен өркеші -->
  <path d="M30 86 C26 64 44 60 52 66 C56 50 72 50 76 64 C88 62 96 72 92 86 Z" fill="#e3a865"/>
  <!-- ою-өрнекті жабу -->
  <path d="M40 74 h44 v10 h-44 z" fill="#0a4c7a"/>
  <path d="M44 79 l4 -3 l4 3 l-4 3 z M58 79 l4 -3 l4 3 l-4 3 z M72 79 l4 -3 l4 3 l-4 3 z" fill="#f2b705"/>
  <!-- мойны мен басы -->
  <path d="M84 70 C90 54 88 40 92 32" stroke="#e3a865" stroke-width="12" stroke-linecap="round" fill="none"/>
  <ellipse cx="98" cy="30" rx="15" ry="12" fill="#e3a865"/>
  <ellipse cx="108" cy="34" rx="7" ry="6" fill="#f0c48f"/>
  <!-- құлақтары -->
  <ellipse cx="88" cy="20" rx="3.5" ry="6" fill="#c98a4a" transform="rotate(-20 88 20)"/>
  <!-- көзі мен кірпігі -->
  <path d="M94.5 28 q3.5 -4.5 7 0" stroke="#14213d" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M94 22 l-2 -3 M97 21 l-0.5 -3.5 M100 21.5 l1 -3" stroke="#14213d" stroke-width="1.3" stroke-linecap="round"/>
  <!-- күлкі мен ұрт -->
  <path d="M103 36 q5 6 10 0 z" fill="#8a3a2b"/>
  <circle cx="102" cy="33" r="2.4" fill="#f08a7a" opacity=".6"/>
  <!-- тақия -->
  <path d="M86 18 q12 -14 24 0 z" fill="#c4342d"/>
  <circle cx="98" cy="9" r="2.6" fill="#f2b705"/>
  <!-- құйрығы -->
  <path d="M30 76 q-8 2 -6 12" stroke="#c98a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="#f2b705">
    <path d="M16 20 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <path d="M60 10 l1.4 3.5 l3.5 1.4 l-3.5 1.4 l-1.4 3.5 l-1.4 -3.5 l-3.5 -1.4 l3.5 -1.4 z"/>
    <path d="M30 46 l1.2 3 l3 1.2 l-3 1.2 l-1.2 3 l-1.2 -3 l-3 -1.2 l3 -1.2 z"/>
  </g>
</svg>
