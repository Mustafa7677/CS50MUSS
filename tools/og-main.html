<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
.og{width:1200px;height:630px;position:relative;overflow:hidden;color:#fff;font-family:"Inter Display",Inter,sans-serif;
 background:radial-gradient(60% 90% at 82% 30%, rgba(242,183,5,.32), transparent 60%), radial-gradient(70% 80% at 0% 100%, rgba(0,175,202,.28), transparent 60%), linear-gradient(150deg,#1d2a6b 0%,#121a45 55%,#0b1233 100%)}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6}
.kick{position:absolute;left:72px;top:72px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);font-size:22px;font-weight:600;color:#ffe3a3}
h1{position:absolute;left:66px;top:118px;margin:0;font-size:220px;line-height:1;font-weight:900;letter-spacing:-.03em}
h1 b{color:#f5c542}
.sub{position:absolute;left:72px;top:350px;width:700px;font-size:32px;line-height:1.3;font-weight:600;color:#e8e6fb}
.proof{position:absolute;left:72px;bottom:70px;display:flex;gap:0;border-radius:18px;background:rgba(10,15,46,.6);border:1px solid rgba(255,255,255,.16)}
.proof div{padding:14px 24px;display:grid;gap:2px}.proof div+div{border-left:1px solid rgba(255,255,255,.14)}
.proof b{font-size:38px;font-weight:900}.proof span{font-size:17px;color:#d9d6f2}
.sun{position:absolute;right:110px;top:120px;width:300px;height:300px}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,#f2b705,#00afca,#f2b705)}
</style></head><body><div class="og">
<div class="stars"><i style="left:640px;top:60px"></i><i style="left:760px;top:140px"></i><i style="left:900px;top:40px"></i><i style="left:1100px;top:90px"></i><i style="left:700px;top:260px"></i><i style="left:1150px;top:470px"></i></div>
<div class="kick">Алаш Орда · 1917 ағартушылық рухы</div>
<h1>AO<b>17</b></h1>
<div class="sub">Бағдарламалау, математика, ағылшын тілі.<br>Қазақ тілінде, тегін.</div>
<svg class="sun" viewBox="-160 -160 320 320"><g id="rays"></g>
<circle r="92" fill="#f5c542"/><circle r="74" fill="none" stroke="#c98a00" stroke-width="7"/>
<g stroke="#c98a00" stroke-width="7" fill="none"><path d="M-52 -40 L52 40 M-40 -52 L40 52 M-52 40 L52 -40 M-40 52 L40 -52"/></g>
<rect x="-17" y="-17" width="34" height="34" fill="#00afca" transform="rotate(20)"/></svg>
<div class="proof"><div><b>NUM_LECT</b><span>дайын сабақ</span></div><div><b>NUM_TASKS</b><span>автотексерілетін тапсырма</span></div><div><b>NUM_QUIZ</b><span>тест сұрағы</span></div><div><b>3</b><span>академия</span></div></div>
<div class="bar"></div></div>
<script>const g=document.getElementById("rays");for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r1=112,r2=i%2?150:138;const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",Math.cos(a)*r1);l.setAttribute("y1",Math.sin(a)*r1);l.setAttribute("x2",Math.cos(a)*r2);l.setAttribute("y2",Math.sin(a)*r2);l.setAttribute("stroke","#f5c542");l.setAttribute("stroke-width","8");l.setAttribute("stroke-linecap","round");g.appendChild(l);}</script>
</body></html>
