# Жергілікті/пилоттық өзін-өзі хостинг үлгісі (сыналмаған). Өндірісте AUTH_DRIVER=supabase (self-hosted GoTrue/Supabase) қажет.
services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [db]
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: change-me, POSTGRES_DB: qazaqcode }
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes: { pgdata: {} }
